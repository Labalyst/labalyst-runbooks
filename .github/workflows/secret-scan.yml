name: secret-scan

# Secret-scan gate for the labalyst/labalyst-runbooks public repo.
#
# Why this exists: this repo is public-readable (ADR-081 Decision 6 — runbooks
# must be reachable during auth outages). Public-readability eliminates auth as
# a barrier to *reading* a leaked secret, so the cost of a single accidental
# commit is materially higher than in a private repo. This workflow is the
# structural mitigation that makes the public-hosting decision safe.
#
# Branch protection on `main` makes this a required status check.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff scan)
        uses: actions/checkout@v4
        with:
          # gitleaks needs full history to diff against the merge base.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Default ruleset + repo-local extensions in .gitleaks.toml
          GITLEAKS_CONFIG: .gitleaks.toml
          # Fail the job on any finding. No GITLEAKS_LICENSE needed for public repos.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
