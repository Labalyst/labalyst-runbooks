name: secret-scan

# Secret-scan gate for the labalyst/labalyst-runbooks public repo.
#
# Why this exists: this repo is public-readable (ADR-081 Decision 6 — runbooks
# must be reachable during auth outages). Public-readability eliminates auth as
# a barrier to *reading* a leaked secret, so the cost of a single accidental
# commit is materially higher than in a private repo. This workflow is the
# structural mitigation that makes the public-hosting decision safe.
#
# We invoke the gitleaks binary directly (MIT license, no key required) rather
# than gitleaks-action@v2, which enforces a paid GITLEAKS_LICENSE for org-owned
# repos. Same scan, no license dance.
#
# Branch protection on `main` makes this a required status check.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - name: Checkout (full history for diff scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks (full repo scan)
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --redact \
            --verbose \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 30
